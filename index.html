from __future__ import annotations
import babase
import bascenev1 as bs


class Player(bs.Player['Team']):
    pass


class Team(bs.Team[Player]):
    def __init__(self) -> None:
        self.score = 0


# ba_meta export bascenev1.GameActivity
class KillRaceGame(bs.TeamGameActivity[Player, Team]):
    name = 'Kill Race'
    description = 'Get the most kills before time runs out.'
    announce_player_deaths = True

    @classmethod
    def get_available_settings(cls, sessiontype):
        return [
            bs.IntChoiceSetting('Time Limit', choices=[
                ('1 Minute', 60), ('2 Minutes', 120), ('5 Minutes', 300)], default=120),
            bs.BoolSetting('Epic Mode', default=False),
        ]

    @classmethod
    def supports_session_type(cls, sessiontype):
        return (issubclass(sessiontype, bs.DualTeamSession)
                or issubclass(sessiontype, bs.FreeForAllSession))

    @classmethod
    def get_supported_maps(cls, sessiontype):
        return bs.app.classic.getmaps('melee')

    def __init__(self, settings: dict):
        super().__init__(settings)
        self._time_limit = float(settings['Time Limit'])
        self._epic_mode = bool(settings['Epic Mode'])
        self.slow_motion = self._epic_mode
        self.default_music = (bs.MusicType.EPIC if self._epic_mode
                              else bs.MusicType.TO_THE_DEATH)

    def get_instance_description(self):
        return 'Get the most kills before time runs out.'

    def get_instance_description_short(self):
        return 'get the most kills'

    def on_begin(self) -> None:
        super().on_begin()
        self.setup_standard_time_limit(self._time_limit)

    def on_player_join(self, player):
        self.spawn_player(player)

    def handlemessage(self, msg):
        if isinstance(msg, bs.PlayerDiedMessage):
            killer = msg.getkillerplayer(Player)
            victim = msg.getplayer(Player)
            if killer is not None and killer.team is not victim.team:
                killer.team.score += 1
                self.stats.player_scored(killer, 10, kill=True)
            self.respawn_player(victim)
        else:
            return super().handlemessage(msg)
        return None

    def end_game(self) -> None:
        results = bs.GameResults()
        for team in self.teams:
            results.set_team_score(team, team.score)
        self.end(results=results)
